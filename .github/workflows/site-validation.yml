name: Site validation

on:
  pull_request:
  push:
    branches: [main, codex/research-platform-polish]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Hugo Extended
        shell: bash
        run: |
          set -euo pipefail
          hugo_dir=$(mktemp -d)
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_extended_0.166.0_linux-amd64.tar.gz \
            --output "$hugo_dir/hugo.tar.gz"
          printf '%s  %s\n' '0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885' "$hugo_dir/hugo.tar.gz" | sha256sum --check
          tar -xzf "$hugo_dir/hugo.tar.gz" -C "$hugo_dir" hugo
          printf '%s\n' "$hugo_dir" >> "$GITHUB_PATH"
      - name: Check JavaScript syntax
        run: node --check static/js/industries.js
      - name: Test industry explorer with translated labels and embedded data
        run: node --test tests/industries.test.mjs
      - name: Test article graphics and source data
        run: node --test tests/article-visuals.test.mjs
      - name: Test contact submission safeguards
        run: node --test tests/contact.test.mjs
      - name: Test Evidence Library search and source extraction
        run: |
          node --test tests/evidence-library.test.mjs
          python3 -m unittest discover -s tests -p 'test_evidence_library.py'
      - name: Build production HTML without warnings
        run: hugo --environment production --minify --panicOnWarning
      - name: Check Evidence Library stays in sync with article citations
        run: python3 scripts/build_evidence_library.py public --check
      - name: Check industry data and site links
        run: python3 scripts/validate_site.py public
      - name: Check sourced industry breakdowns
        run: python3 scripts/validate_breakdowns.py public
      - name: Check article graphics, provenance and CSV exports
        run: python3 scripts/validate_article_visuals.py public
      - name: Install browser verification tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify interactive articles on desktop and mobile
        run: node tests/article-visuals.browser.mjs
      - name: Verify contact and keyboard controls on desktop and mobile
        run: node tests/site-controls.browser.mjs
      - name: Verify industry pages, details and mobile filtering
        run: node tests/industry-pages.browser.mjs
      - name: Verify Evidence Library search, links and keyboard controls
        run: node tests/evidence-library.browser.mjs
      - name: Verify native page transitions and navigation fallbacks
        run: |
          node --test tests/page-transitions.test.mjs
          node tests/page-transitions.browser.mjs

name: Isolated admin step-up PostgreSQL 17 check

on:
  push:
    branches: [codex/admin-stepup-pg17-check]

permissions:
  contents: read

jobs:
  synthetic-races:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only this approved test commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --prefix test-packages/admin-stepup-pg17 --ignore-scripts
      - name: Run isolated synthetic PostgreSQL concurrency tests
        shell: bash
        env:
          DEX_RUN_LOCAL_POSTGRES_RACES: 'true'
        run: |
          set -euo pipefail
          container="dex-stepup-pg17-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p /tmp/dex-pg-test/socket
          # This directory contains only the disposable, network-disabled test socket.
          chmod 777 /tmp/dex-pg-test/socket
          image='postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3'
          cleanup() {
            status=$?
            trap - EXIT
            docker inspect "$container" --format '{{json .State}}' || true
            docker logs "$container" || true
            docker rm -fv "$container" || true
            exit "$status"
          }
          trap cleanup EXIT
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}'
          docker run --detach --name "$container" --network none \
            -e POSTGRES_USER=agent -e POSTGRES_DB=postgres -e PGDATA=/tmp/dex-pg-test/data \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e PGPORT=55439 \
            -v /tmp/dex-pg-test/socket:/var/run/postgresql \
            "$image" \
            -c listen_addresses='' \
            -c unix_socket_directories=/var/run/postgresql \
            -c port=55439
          for attempt in $(seq 1 60); do
            state="$(docker inspect "$container" --format '{{.State.Status}}')"
            case "$state" in exited|dead) echo "Test database exited before readiness"; exit 1;; esac
            logs="$(docker logs "$container" 2>&1)"
            if grep -Fq "PostgreSQL init process complete; ready for start up." <<< "$logs" && \
               docker exec "$container" pg_isready -h /var/run/postgresql -p 55439 -U agent -d postgres; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          node --test test-packages/admin-stepup-pg17/tests/postgres/races.test.mjs

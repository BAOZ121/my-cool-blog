ll="#67675e" text-anchor="start">5,592 tonnes</text><path d="M 95 929 L 1705 929" fill="none" stroke="#ddd6c3" stroke-width="2"/><text x="95" y="979" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#67675e" text-anchor="start">Basis: metric tonnes of contained metal; not company revenue or refined supply.</text><text x="95" y="1022" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#67675e" text-anchor="start">Other and rounding = the published world total minus the five named countries.</text><text x="95" y="1065" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#67675e" text-anchor="start">Rwanda uses export data; year ends vary. BGS notes unquantified US production.</text><text x="95" y="1108" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#67675e" text-anchor="start">Shares are rounded to 0.1%; the displayed shares may not sum exactly to 100%.</text><text x="95" y="1160" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#a88332" text-anchor="start">Source [E02]: BGS, World Mineral Production 2020–24 (2026), p. 74. Read 27 Oct 2026.</text></svg>
="normal" text-anchor="start">Author-calculated shares: each row / row sum (68,077 thousand SWU/year).</text><text x="70" y="958" font-size="25" fill="#707070" font-weight="normal" text-anchor="start">Published total is 68,076; the source does not explain the 1 thousand SWU/year difference.</text><text x="70" y="994" font-size="25" fill="#707070" font-weight="normal" text-anchor="start">Read 13 October 2026. One decimal; displayed shares total 100.0%.</text></svg>
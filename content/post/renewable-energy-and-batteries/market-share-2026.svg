<path d="M 417.53160 1202.68438 A 527.5 527.5 0 0 1 940.00000 602.50000" fill="none" stroke="#BAC5D0" stroke-width="255"/>
<text x="940" y="985" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#536577" text-anchor="middle" dominant-baseline="central">TOTAL USAGE</text>
<text x="940" y="1120" font-family="Arial, sans-serif" font-size="145" font-weight="700" fill="#163049" text-anchor="middle" dominant-baseline="central">844.2</text>
<text x="940" y="1265" font-family="Arial, sans-serif" font-size="75" font-weight="400" fill="#536577" text-anchor="middle" dominant-baseline="central">GWh</text>
<text x="1900" y="565" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#536577" text-anchor="start" dominant-baseline="central">SUPPLIER</text>
<text x="3440" y="565" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#536577" text-anchor="end" dominant-baseline="central">SHARE</text>
<rect x="1900" y="697" width="66" height="66" rx="10" fill="#2472AB" stroke="none" stroke-width="3"/>
<text x="2010" y="730" font-family="Arial, sans-serif" font-size="63" font-weight="700" fill="#163049" text-anchor="start" dominant-baseline="central">CATL</text>
<text x="3440" y="730" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#163049" text-anchor="end" dominant-baseline="central">39.4%</text>
<rect x="1900" y="887" width="66" height="66" rx="10" fill="#138F86" stroke="none" stroke-width="3"/>
<text x="2010" y="920" font-family="Arial, sans-serif" font-size="63" font-weight="700" fill="#163049" text-anchor="start" dominant-baseline="central">BYD</text>
<text x="3440" y="920" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#163049" text-anchor="end" dominant-baseline="central">15.1%</text>
<rect x="1900" y="1077" width="66" height="66" rx="10" fill="#50A5C7" stroke="none" stroke-width="3"/>
<text x="2010" y="1110" font-family="Arial, sans-serif" font-size="63" font-weight="700" fill="#163049" text-anchor="start" dominant-baseline="central">LG Energy Solution</text>
<text x="3440" y="1110" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#163049" text-anchor="end" dominant-baseline="central">8.1%</text>
<rect x="1900" y="1267" width="66" height="66" rx="10" fill="#A7772E" stroke="none" stroke-width="3"/>
<text x="2010" y="1300" font-family="Arial, sans-serif" font-size="63" font-weight="700" fill="#163049" text-anchor="start" dominant-baseline="central">CALB</text>
<text x="3440" y="1300" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#163049" text-anchor="end" dominant-baseline="central">5.3%</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3600" height="2400" viewBox="0 0 3600 2400" role="img" aria-labelledby="title desc">
<title id="title">Vehicle battery usage by supplier</title>
<desc id="desc">Ring chart of January–August 2026 vehicle battery energy usage across 80 countries: CATL 39.4%, BYD 15.1%, LG Energy Solution 8.1%, CALB 5.3%, Gotion 4.9%, and other suppliers 27.2%. Total 844.2 GWh. Source SNE Research; stationary storage excluded.</desc>
<rect width="3600" height="2400" fill="#FFFFFF"/>
<text x="150" y="145" font-family="Arial, sans-serif" font-size="92" font-weight="700" fill="#163049" text-anchor="start" dominant-baseline="central">Vehicle battery usage by supplier</text>
<text x="150" y="270" font-family="Arial, sans-serif" font-size="47" font-weight="400" fill="#536577" text-anchor="start" dominant-baseline="central">January-August 2026  |  80 countries  |  Share of battery energy installed (%)</text>
<text x="150" y="350" font-family="Arial, sans-serif" font-size="48" font-weight="400" fill="#536577" text-anchor="start" dominant-baseline="central">Registered EV, PHEV and HEV vehicles; stationary storage excluded</text>
<path d="M 940.00000 602.50000 A 527.5 527.5 0 0 1 1265.92095 1544.76715" fill="none" stroke="#2472AB" stroke-width="255"/>
<path d="M 1265.92095 1544.76715 A 527.5 527.5 0 0 1 792.83219 1636.55492" fill="none" stroke="#138F86" stroke-width="255"/>

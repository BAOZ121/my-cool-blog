<rect x="1900" y="1647" width="66" height="66" rx="10" fill="#BAC5D0" stroke="none" stroke-width="3"/>
<text x="2010" y="1680" font-family="Arial, sans-serif" font-size="63" font-weight="700" fill="#163049" text-anchor="start" dominant-baseline="central">Other suppliers</text>
<text x="3440" y="1680" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#163049" text-anchor="end" dominant-baseline="central">27.2%</text>
<polyline points="150,1930 3450,1930" fill="none" stroke="#D7E0E8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150" y="2020" font-family="Arial, sans-serif" font-size="45" font-weight="400" fill="#536577" text-anchor="start" dominant-baseline="central">Source: SNE Research [M01], 2 Oct 2026; original supplier table read 6 Oct 2026.</text>
<text x="150" y="2110" font-family="Arial, sans-serif" font-size="45" font-weight="400" fill="#536577" text-anchor="start" dominant-baseline="central">Third-party estimates. Other suppliers = 100 - 39.4 - 15.1 - 8.1 - 5.3 - 4.9 = 27.2%.</text>
<text x="150" y="2200" font-family="Arial, sans-serif" font-size="45" font-weight="400" fill="#536577" text-anchor="start" dominant-baseline="central">Other suppliers includes every supplier outside the five named companies; calculated residual.</text>
<text x="150" y="2290" font-family="Arial, sans-serif" font-size="45" font-weight="400" fill="#536577" text-anchor="start" dominant-baseline="central">Published CATL + BYD total 54.6%; rounded components total 54.5%. Cause unverified.</text>

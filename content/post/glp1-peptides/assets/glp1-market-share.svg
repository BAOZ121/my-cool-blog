  </g>
  <g id="text_12">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #262821" x="69.12" y="612" transform="rotate(-0 69.12 612)">Scope: source-defined GLP-1 diabetes market, not all obesity medicines, peptide APIs or CDMOs.</text>
  </g>
  <g id="text_13">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #595c54" x="69.12" y="644.4" transform="rotate(-0 69.12 644.4)">Other = 100% − 45.8%. Do not interpret the residual as Lilly alone. International tirzepatide is</text>
  </g>
  <g id="text_14">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #595c54" x="69.12" y="663.12" transform="rotate(-0 69.12 663.12)">classified as diabetes in the source; regional coverage is incomplete. Source [M01], FY2025 report p.7.</text>

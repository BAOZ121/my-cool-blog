# OPTIONAL USER-RUN FIXTURE ONLY. Not executed in the restricted cloud workspace.
# PostgreSQL digest verified by the approved 2026-10-13 Actions pull. Node tag is not digest-pinned.
services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: postgres
      PGPORT: '55439'
      PGDATA: /tmp/dex-pg-test/data
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - listen_addresses=
      - -c
      - unix_socket_directories=/var/run/postgresql
      - -c
      - port=55439
    network_mode: none
    tmpfs:
      - /tmp/dex-pg-test/data
    volumes:
      - fixture_socket:/var/run/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, /var/run/postgresql, -p, '55439', -U, agent, -d, postgres]
      interval: 1s
      timeout: 3s
      retries: 30
  tests:
    image: node:22-bookworm-slim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEX_RUN_LOCAL_POSTGRES_RACES: 'true'
    volumes:
      - ../../:/suite:ro
      - fixture_socket:/tmp/dex-pg-test/socket
    command:
      - bash
      - -ceu
      - >-
        mkdir -p /tmp/run;
        cp /suite/package.json /suite/package-lock.json /tmp/run/;
        cp -r /suite/tests /suite/migrations /suite/ops /tmp/run/;
        cd /tmp/run;
        npm ci --ignore-scripts;
        node --test tests/postgres/races.test.mjs
volumes:
  fixture_socket:

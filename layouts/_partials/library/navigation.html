    <ul class="library-nav__links">
        {{- $current := .RelPermalink -}}
        {{- range partial "library/categories.html" . -}}
        <li><a href="{{ .url | relURL }}"{{ if eq $current (.url | relURL) }} aria-current="page"{{ end }}>{{ .name }}</a></li>
        {{- end -}}
    </ul>
</nav>

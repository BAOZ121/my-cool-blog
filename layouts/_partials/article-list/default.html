{{ $image := partial "helper/image" (dict "Image" .Params.image "Resources" .Resources "Context" .) }}
<article class="{{ if $image }}has-image{{ end }}{{ if eq .Params.entryBrand "nvidia" }} article-brand-nvidia{{ else if eq .Params.entryBrand "amd" }} article-brand-amd{{ else if eq .Params.entryTheme "nvidia" }} biography-card--nvidia{{ else if eq .Params.entryTheme "amd" }} biography-card--amd{{ end }}">
    {{ partial "article/components/header" (dict "Page" . "IsList" true) }}
</article>

baseURL = "https://thedexs.com/"
defaultContentLanguage = "en"
theme = "stack"
enableRobotsTXT = true

# Global settings
[params]
    mainSections = ["post", "posts"]
    favicon = "/favicon.png"

    [params.dateFormat]
        published = "2006-01-02"
        updated = "2006-01-02"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "categories" },
            { type = "tag-cloud" }
        ]

# Language configuration (English only)
[languages]

    [languages.en]
        languageCode = "en"
        languageName = "English"
        title = "Dex's Blog"
        weight = 1

        [languages.en.params.sidebar]
            compact = false
            avatar = "/avatar.jpg"
            subtitle = "Tech & Thoughts"

        # Main navigation
        [[languages.en.menu.main]]
            identifier = "home"
            name = "Home"
            url = "/"
            weight = 1
            params = { icon = "home" }

        [[languages.en.menu.main]]
            identifier = "archives"
            name = "Archives"
            url = "/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.en.menu.main]]
            identifier = "search"
            name = "Search"
            url = "/search/"
            weight = 3
            params = { icon = "search" }

        [[languages.en.menu.main]]
            identifier = "about"
            name = "AboutMe"
            url = "/about/"
            weight = 4
            params = { icon = "user" }

        # Social links
        [[languages.en.menu.social]]
            identifier = "youtube"
            name = "YouTube"
            url = "https://www.youtube.com/@ZeRuiDong"
            params = { icon = "brand-youtube" }

        [[languages.en.menu.social]]
            identifier = "email"
            name = "Email"
            url = "mailto:dex222444@gmail.com"
            params = { icon = "mail" }

# Allow raw HTML in Markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Simplify page URLs (remove /page/ prefix)
[permalinks]
    page = "/:slug/"

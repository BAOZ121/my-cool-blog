baseURL = "https://thedexs.com/"
defaultContentLanguage = "zh-cn"
theme = "stack"

# 全局通用配置
[params]
    mainSections = ["post", "posts"]
    favicon = "favicon.png"

    [params.dateFormat]
        published = "2006-01-02"
        updated = "2006-01-02"

    [params.sidebar]
        compact = false
        avatar = "/avatar.jpg"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "categories" },
            { type = "tag-cloud" }
        ]

# 多语言配置
[languages]

    # 1. 中文配置
    [languages.zh-cn]
        languageCode = "zh-cn"
        languageName = "中文"
        title = "Dex的个人博客"
        weight = 1

        [languages.zh-cn.params.sidebar]
            subtitle = "记录技术与思考"

        # 中文主导航菜单
        [[languages.zh-cn.menu.main]]
            identifier = "home"
            name = "首页"
            url = "/"
            weight = 1
            params = { icon = "home" }

        [[languages.zh-cn.menu.main]]
            identifier = "archives"
            name = "归档"
            url = "/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.zh-cn.menu.main]]
            identifier = "search"
            name = "搜索"
            url = "/search/"
            weight = 3
            params = { icon = "search" }

        # 中文社交菜单
        [[languages.zh-cn.menu.social]]
            identifier = "youtube"
            name = "YouTube"
            url = "https://www.youtube.com/@ZeRuiDong"
            params = { icon = "brand-youtube" }

        [[languages.zh-cn.menu.social]]
            identifier = "email"
            name = "Email"
            url = "mailto:dex222444@gmail.com"
            params = { icon = "mail" }

    # 2. 英文配置
    [languages.en]
        languageCode = "en"
        languageName = "English"
        title = "Dex's Blog"
        weight = 2

        [languages.en.params.sidebar]
            subtitle = "Tech & Thoughts"

        # 英文主导航菜单
        [[languages.en.menu.main]]
            identifier = "home"
            name = "Home"
            url = "/en/"
            weight = 1
            params = { icon = "home" }

        [[languages.en.menu.main]]
            identifier = "archives"
            name = "Archives"
            url = "/en/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.en.menu.main]]
            identifier = "search"
            name = "Search"
            url = "/en/search/"
            weight = 3
            params = { icon = "search" }

        # 英文社交菜单
        [[languages.en.menu.social]]
            identifier = "youtube"
            name = "YouTube"
            url = "https://www.youtube.com/@ZeRuiDong"
            params = { icon = "brand-youtube" }

        [[languages.en.menu.social]]
            identifier = "email"
            name = "Email"
            url = "mailto:dex222444@gmail.com"
            params = { icon = "mail" }
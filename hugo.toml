baseURL = "https://thedexs.com/"
defaultContentLanguage = "en"
theme = "stack"

# 全局通用配置
[params]
    mainSections = ["post", "posts"]
    favicon = "/favicon.png"

    [params.dateFormat]
        published = "2006-01-02"
        updated = "2006-01-02"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "categories" },
            { type = "tag-cloud" }
        ]

# 多语言配置
[languages]

    # 1. 默认语言：英文
    [languages.en]
        languageCode = "en"
        languageName = "English"
        title = "Dex's Blog"
        weight = 1

        [languages.en.params.sidebar]
            compact = false
            avatar = "/avatar.jpg"
            subtitle = "Tech & Thoughts"

        # 英文主导航菜单
        [[languages.en.menu.main]]
            identifier = "home"
            name = "Home"
            url = "/"
            weight = 1
            params = { icon = "home" }

        [[languages.en.menu.main]]
            identifier = "archives"
            name = "Archives"
            url = "/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.en.menu.main]]
            identifier = "search"
            name = "Search"
            url = "/search/"
            weight = 3
            params = { icon = "search" }

        # 英文社交菜单
        [[languages.en.menu.social]]
            identifier = "youtube"
            name = "YouTube"
            url = "https://www.youtube.com/@ZeRuiDong"
            params = { icon = "brand-youtube" }

        [[languages.en.menu.social]]
            identifier = "email"
            name = "Email"
            url = "mailto:dex222444@gmail.com"
            params = { icon = "mail" }

    # 2. 次要语言：中文
    [languages.zh-cn]
        languageCode = "zh-cn"
        languageName = "中文"
        title = "Dex的个人博客"
        weight = 2

        [languages.zh-cn.params.sidebar]
            compact = false
            avatar = "/avatar.jpg"
            subtitle = "记录技术与思考"

        # 中文主导航菜单
        [[languages.zh-cn.menu.main]]
            identifier = "home"
            name = "首页"
            url = "/zh-cn/"
            weight = 1
            params = { icon = "home" }

        [[languages.zh-cn.menu.main]]
            identifier = "archives"
            name = "归档"
            url = "/zh-cn/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.zh-cn.menu.main]]
            identifier = "search"
            name = "搜索"
            url = "/zh-cn/search/"
            weight = 3
            params = { icon = "search" }

        # 中文社交菜单
        [[languages.zh-cn.menu.social]]
            identifier = "youtube"
            name = "YouTube"
            url = "https://www.youtube.com/@ZeRuiDong"
            params = { icon = "brand-youtube" }

        [[languages.zh-cn.menu.social]]
            identifier = "email"
            name = "Email"
            url = "mailto:dex222444@gmail.com"
            params = { icon = "mail" }

# 允许 Markdown 内渲染原生 HTML 标签与颜色样式
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
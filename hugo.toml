baseURL = "https://thedexs.com/"
defaultContentLanguage = "en"
theme = "stack"
enableRobotsTXT = true

# Global settings
[params]
    mainSections = ["post"]
    favicon = "/favicon.png"
    description = "Independent industry research on market structure, technology, growth, and risk."

    [params.dateFormat]
        published = "2006-01-02"
        lastUpdated = "2006-01-02"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "categories" },
            { type = "tag-cloud" }
        ]
        page = [
            { type = "toc" }
        ]

    [params.article]
        headingAnchor = true
        toc = true
        readingTime = true

# Language configuration (English only)
[languages]

    [languages.en]
        locale = "en"
        label = "English"
        title = "DEX Research"
        weight = 1

        [languages.en.params.sidebar]
            compact = false
            avatar = "/avatar.jpg"
            subtitle = "Independent Industry Research"

        # Main navigation
        [[languages.en.menu.main]]
            identifier = "home"
            name = "Home"
            url = "/"
            weight = 1
            params = { icon = "home" }

        [[languages.en.menu.main]]
            identifier = "industries"
            name = "Industries"
            url = "/industries/"
            weight = 2
            params = { icon = "chart-bar" }

        [[languages.en.menu.main]]
            identifier = "industry-breakdowns"
            name = "Industry Breakdowns"
            url = "/industry-breakdowns/"
            weight = 3
            params = { icon = "chart-bar" }

        [[languages.en.menu.main]]
            identifier = "archives"
            name = "Archives"
            url = "/archives/"
            weight = 4
            params = { icon = "archives" }

        [[languages.en.menu.main]]
            identifier = "search"
            name = "Search"
            url = "/search/"
            weight = 5
            params = { icon = "search" }

        [[languages.en.menu.main]]
            identifier = "about"
            name = "About & Methodology"
            url = "/about/"
            weight = 6
            params = { icon = "user" }

        # Social links (sidebar)
        [[languages.en.menu.social]]
            identifier = "github"
            name = "GitHub"
            url = "https://github.com/BAOZ121"
            params = { icon = "brand-github", newTab = true }

        [[languages.en.menu.social]]
            identifier = "youtube"
            name = "YouTube"
            url = "https://www.youtube.com/@ZeRuiDong"
            params = { icon = "brand-youtube", newTab = true }

        [[languages.en.menu.social]]
            identifier = "email"
            name = "Email"
            url = "mailto:dex222444@gmail.com"
            params = { icon = "mail" }

# Allow raw HTML in Markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Simplify page URLs (remove /page/ prefix)
[permalinks]
    page = "/:slug/"

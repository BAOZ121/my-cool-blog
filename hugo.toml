baseURL = "https://thedexs.com/"
defaultContentLanguage = "zh-cn"
theme = "stack"

# 全局通用配置
[params]
    mainSections = ["post", "posts"]
    favicon = "favicon.png"
    [params.dateFormat]
        published = "2006-01-02"
        updated = "2006-01-02"

    [params.sidebar]
        compact = false
        avatar = "/avatar.jpg"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "categories" },
            { type = "tag-cloud" }
        ]
[[params.social]]
    name = "YouTube"
    icon = "brand-youtube"
    url = "https://www.youtube.com/@ZeRuiDong"

[[params.social]]
    name = "Email 1"
    icon = "mail"
    url = "mailto:dex222444@gmail.com"


# 多语言设置
[languages]
    # 1. 中文配置
    [languages.zh-cn]
        languageCode = "zh-cn"
        languageName = "中文"
        title = "Dex的个人博客"
        weight = 1

        [languages.zh-cn.params.sidebar]
            subtitle = "记录技术与思考"

        [[languages.zh-cn.menu.main]]
            identifier = "home"
            name = "首页"
            url = "/"
            weight = 1
            params = { icon = "home" }

        [[languages.zh-cn.menu.main]]
            identifier = "archives"
            name = "归档"
            url = "/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.zh-cn.menu.main]]
            identifier = "search"
            name = "搜索"
            url = "/search/"
            weight = 3
            params = { icon = "search" }

    # 2. 英文配置
    [languages.en]
        languageCode = "en"
        languageName = "English"
        title = "Dex's Blog"
        weight = 2

        [languages.en.params.sidebar]
            subtitle = "Tech & Thoughts"

        [[languages.en.menu.main]]
            identifier = "home"
            name = "Home"
            url = "/en/"
            weight = 1
            params = { icon = "home" }

        [[languages.en.menu.main]]
            identifier = "archives"
            name = "Archives"
            url = "/en/archives/"
            weight = 2
            params = { icon = "archives" }

        [[languages.en.menu.main]]
            identifier = "search"
            name = "Search"
            url = "/en/search/"
            weight = 3
            params = { icon = "search" }
